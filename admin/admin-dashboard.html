<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard | E-Book</title>

    <!-- Google Font -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
        rel="stylesheet">

    <!-- Data aos plugin (animation) link -->
    <link rel="stylesheet" href="https://unpkg.com/aos@next/dist/aos.css" />

    <!-- bootstrap 5 link -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- box icons link -->
    <link href="https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css" rel="stylesheet">

    <!-- custom css link -->
    <link rel="stylesheet" href="./css/admin-sidebar-common.css">
    <link rel="stylesheet" href="./css/admin-dashboard.css">
</head>

<body>
    <button id="menuBtn">
        <i class='bx bx-menu'></i>
    </button>
    <nav id="sidebar">
        <ul>
            <li class="sidebar-title">
                <a href="#" id="title" onclick="toggleSidebar(event)"><span class="dashboard-text">Dashboard</span> <i
                        class="bx bx-chevrons-right" id="sidebarArrow"></i></a>
            </li>
            <li class="active">
                <a href="admin-dashboard.html"><i class="bx bx-home"></i> <span>Home</span></a>
            </li>
            <li class="nav-item dropdown">
                <button class="sidebar-toggle-btn" onclick="toggleBooks()">
                    <div class="left-menu">
                        <i class="bx bx-book-open"></i>
                        <span>Books</span>
                    </div>
                    <i class="bx bx-chevron-down ms-3" id="bookArrow"></i>
                </button>
                <ul class="submenu" id="bookMenu">
                    <li>
                        <a href="add-book.html">Add Book</a>
                    </li>

                    <li>
                        <a href="manage-book.html">Manage Book</a>
                    </li>
                </ul>
            </li>
            <li class="nav-item dropdown">
                <button class="sidebar-toggle-btn" onclick="toggleOrder()">
                    <div class="left-menu">
                        <i class="bx bx-cart-add"></i>
                        <span>Orders</span>
                    </div>
                    <i class="bx bx-chevron-down ms-2" id="orderArrow"></i>
                </button>
                <ul class="submenu" id="orderMenu">
                    <li>
                        <a href="manage-orders.html">Manage Orders</a>
                    </li>
                </ul>
            </li>
            <li class="nav-item dropdown">
                <button class="sidebar-toggle-btn" onclick="toggleUsers()">
                    <div class="left-menu">
                        <i class="bx bx-user"></i>
                        <span>Users</span>
                    </div>
                    <i class="bx bx-chevron-down ms-3" id="userArrow"></i>
                </button>
                <ul class="submenu" id="userMenu">
                    <li>
                        <a href="all-users.html">All Users</a>
                    </li>
                </ul>
            </li>
            <li>
                <a href="#" onclick="logoutUser(event)"><i class="bx bx-log-out"></i> <span>Logout</span></a>
            </li>
        </ul>
    </nav>
    <div id="sidebarOverlay"></div>

    <!-- ========== Start Main Section ========== -->
    <main>
        <div class="main-topbar">
            <div class="main-topbar-content">
                <h3>Dashboard</h3>
                <p>Welcome back! 👋</p>
            </div>
        </div>
        <div class="dashboard-home">
            <div class="dashboard-card">
                <i class='bx bx-book-open'></i>
                <h3 id="totalBooks">0</h3>
                <p>Total Books</p>
            </div>
            <div class="dashboard-card">
                <i class='bx bx-user'></i>
                <h3 id="totalUsers">0</h3>
                <p>Total Users</p>
            </div>
            <div class="dashboard-card">
                <i class='bx bx-cart'></i>
                <h3 id="totalOrders">0</h3>
                <p>Total Orders</p>
            </div>
        </div>
        <div class="dashboard-bottom">
            <div class="recent-box">
                <h4>Recent Books</h4>
                <ul id="recentBooks">
                </ul>
            </div>
            <div class="recent-box">
                <h4>Recent Users</h4>
                <ul id="recentUsers"></ul>
            </div>
        </div>
    </main>
    <!-- ========== End Main Section ========== -->


    <!-- box icons script link -->
    <script src="https://unpkg.com/boxicons@2.1.4/dist/boxicons.js" rel="stylesheet"></script>

    <!-- bootstrap script  -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>

    <!-- custom js file -->
    <script src="./js/common.js"></script>
    <script src="./js/admin-dashboard.js"></script>
</body>

</html>
