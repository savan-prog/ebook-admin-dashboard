<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>All Books | E-Book</title>

    <!-- Google Font -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
        rel="stylesheet">

    <!-- Data aos plugin (animation) link -->
    <link rel="stylesheet" href="https://unpkg.com/aos@next/dist/aos.css" />

    <!-- bootstrap 5 link -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- box icons link -->
    <link href="https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css" rel="stylesheet">

    <!-- custom css link -->
    <link rel="stylesheet" href="./css/user-sidebar-common.css">
    <link rel="stylesheet" href="./css/user-dashboard-common.css">
    <link rel="stylesheet" href="./css/all-book.css">
</head>

<body>
    <!-- ========== Start nav Section ========== -->
    <div class="wrapper">
        <button id="menuBtn">
            <i class='bx bx-menu'></i>
        </button>
        <nav id="sidebar">
            <ul>

                <li class="sidebar-title">
                    <a href="#" id="title" onclick="toggleSidebar(event)">
                        <span class="dashboard-text">Dashboard</span>
                        <i class="bx bx-chevrons-right" id="sidebarArrow"></i>
                    </a>
                </li>

                <li class="active">
                    <a href="user-dashboard.html">
                        <i class="bx bx-home"></i>
                        <span>Home</span>
                    </a>
                </li>

                <li class="nav-item dropdown">
                    <button class="sidebar-toggle-btn" onclick="toggleBooks()">

                        <div class="left-menu">
                            <i class="bx bx-book-open"></i>
                            <span>Books</span>
                        </div>

                        <i class="bx bx-chevron-down ms-3" id="bookArrow"></i>

                    </button>

                    <ul class="submenu" id="bookMenu">
                        <li>
                            <a href="all-book.html">All Books</a>
                        </li>

                        <li>
                            <a href="my-cart.html">My Cart</a>
                        </li>
                    </ul>
                </li>

                <li>
                    <a href="my-orders.html">
                        <i class="bx bx-cart-add"></i>
                        <span>My Orders</span>
                    </a>
                </li>

                <li>
                    <a href="user-profile.html">
                        <i class="bx bx-user"></i>
                        <span>Profile</span>
                    </a>
                </li>

                <li>
                    <a href="#" onclick="logoutUser(event)">
                        <i class="bx bx-log-out"></i>
                        <span>Logout</span>
                    </a>
                </li>
            </ul>
        </nav>
        <div id="sidebarOverlay"></div>
        <!-- ========== End nav Section ========== -->


        <!-- ========== Start Main Section ========== -->
        <main>
            <div class="main-topbar">
                <div class="main-topbar-content">
                    <div class="allBook-dashboard">
                        <h3>Dashboard</h3>
                        <p id="username"> </p>
                    </div>
                    <div>
                        <ul>
                            <li>
                                <a href="">Home</a>
                                <span>/Dashboard</span>
                                <span>/Books</span>
                                <span>/All Books</span>
                            </li>
                        </ul>
                    </div>
                </div>
            </div>
            <div class="topbar-middle-content">
                <h3>All Books</h3>
                <div class="search-input">
                    <input type="text" id="searchBook" placeholder="Search Book" onkeyup="searchBook()">
                </div>
                <div class="row g-4" id="bookContainer">

                </div>
            </div>
            <div class="modal fade" id="viewBookModal">
                <div class="modal-dialog">
                    <div class="modal-content">
                        <div class="modal-header bg-danger">
                            <h5>Book Details</h5>
                            <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close">
                            </button>
                        </div>
                        <div class="modal-body">
                            <div class="text-center">
                                <img id="viewImage" class="mb-3" width="250px" height="300px">
                            </div>
                            <p><strong>Title :</strong>
                                <span id="viewTitle"></span>
                            </p>
                            <p><strong>Author :</strong>
                                <span id="viewAuthor"></span>
                            </p>
                            <p><strong>Category :</strong>
                                <span id="viewCategory"></span>
                            </p>
                            <p><strong>Price :</strong>
                                ₹<span id="viewPrice"></span>
                            </p>
                            <p><strong>Description :</strong>
                                <span id="viewDescription"></span>
                            </p>
                        </div>
                    </div>
                </div>
            </div>
        </main>
    </div>
    <!-- ========== End Main Section ========== -->


    <!-- box icons script link -->
    <script src="https://unpkg.com/boxicons@2.1.4/dist/boxicons.js" rel="stylesheet"></script>

    <!-- bootstrap script  -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>

    <!-- custome js link -->
    <script src="./js/user-common.js"></script>
    <script src="./js/all-book.js"></script>
</body>

</html>
