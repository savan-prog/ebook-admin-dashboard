<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>User Profile | E-Book</title>

    <!-- Google Font -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
        rel="stylesheet">

    <!-- Data aos plugin (animation) link -->
    <link rel="stylesheet" href="https://unpkg.com/aos@next/dist/aos.css" />

    <!-- bootstrap 5 link -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- box icons link -->
    <link href="https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css" rel="stylesheet">

    <!-- custom css link -->
    <link rel="stylesheet" href="./css/user-sidebar-common.css">
    <link rel="stylesheet" href="./css/user-dashboard-common.css">
    <link rel="stylesheet" href="./css/user-profile.css">
</head>

<body>
    <!-- ========== Start nav Section ========== -->
    <div class="wrapper">
        <button id="menuBtn">
            <i class='bx bx-menu'></i>
        </button>
        <nav id="sidebar">
            <ul>

                <li class="sidebar-title">
                    <a href="#" id="title" onclick="toggleSidebar(event)">
                        <span class="dashboard-text">Dashboard</span>
                        <i class="bx bx-chevrons-right" id="sidebarArrow"></i>
                    </a>
                </li>

                <li class="active">
                    <a href="user-dashboard.html">
                        <i class="bx bx-home"></i>
                        <span>Home</span>
                    </a>
                </li>

                <li class="nav-item dropdown">
                    <button class="sidebar-toggle-btn" onclick="toggleBooks()">

                        <div class="left-menu">
                            <i class="bx bx-book-open"></i>
                            <span>Books</span>
                        </div>

                        <i class="bx bx-chevron-down ms-3" id="bookArrow"></i>

                    </button>

                    <ul class="submenu" id="bookMenu">
                        <li>
                            <a href="all-book.html">All Books</a>
                        </li>

                        <li>
                            <a href="my-cart.html">My Cart</a>
                        </li>
                    </ul>
                </li>

                <li>
                    <a href="my-orders.html">
                        <i class="bx bx-cart-add"></i>
                        <span>My Orders</span>
                    </a>
                </li>

                <li>
                    <a href="user-profile.html">
                        <i class="bx bx-user"></i>
                        <span>Profile</span>
                    </a>
                </li>

                <li>
                    <a href="#" onclick="logoutUser(event)">
                        <i class="bx bx-log-out"></i>
                        <span>Logout</span>
                    </a>
                </li>
            </ul>
        </nav>
        <div id="sidebarOverlay"></div>
        <!-- ========== End nav Section ========== -->


        <!-- ========== Start Main Section ========== -->
        <main>
            <div class="main-topbar">
                <div class="main-topbar-content">
                    <div class="allBook-dashboard">
                        <h3>Dashboard</h3>
                        <p id="username"> </p>
                    </div>
                    <div>
                        <ul>
                            <li>
                                <a href="">Home</a>
                                <span>/Dashboard</span>
                                <span>/User Profile</span>
                            </li>
                        </ul>
                    </div>
                </div>
            </div>

            <div class="profile-container">
                <div class="profile-card">
                    <h3>My Profile</h3>
                    <div class="profile-row">
                        <label>Username</label>
                        <p id="profileUsername"></p>
                    </div>
                    <div class="profile-row">
                        <label>Email</label>
                        <p id="profileEmail"></p>
                    </div>
                    <div class="profile-row">
                        <label>Status</label>
                        <p id="profileStatus"></p>
                    </div>
                </div>
            </div>

            <div class="edit-profile-container">
                <div class="edit-profile-card">
                    <h4>Edit Profile</h4>
                    <div class="form-group">
                        <label>Username</label>
                        <input type="text" id="editUsername" class="form-control">
                    </div>
                    <div class="form-group mt-3">
                        <label>Email</label>
                        <input type="email" id="editEmail" class="form-control">
                    </div>
                    <button class="btn btn-primary mt-4" onclick="updateProfile()">
                        Update Profile
                    </button>
                    <p id="profileMessage" class="mt-3"></p>
                </div>
            </div>

            <div class="change-password-container">
                <div class="change-password-card">
                    <h4>Change Password</h4>
                    <div class="form-group">
                        <label>Current Password</label>
                        <input type="password" id="currentPassword" class="form-control">
                    </div>
                    <div class="form-group mt-3">
                        <label>New Password</label>
                        <input type="password" id="newPassword" class="form-control">
                    </div>
                    <div class="form-group mt-3">
                        <label>Confirm Password</label>
                        <input type="password" id="confirmPassword" class="form-control">
                    </div>
                    <button class="btn btn-success mt-4" onclick="changePassword()">
                        Change Password
                    </button>
                    <p id="passwordMessage" class="mt-3"></p>
                </div>
            </div>
        </main>
    </div>
    <!-- ========== End Main Section ========== -->


    <!-- box icons script link -->
    <script src="https://unpkg.com/boxicons@2.1.4/dist/boxicons.js" rel="stylesheet"></script>

    <!-- bootstrap script  -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>

    <!-- custome js link -->
    <script src="./js/user-common.js"></script>
    <script src="./js/user-profile.js"></script>
</body>

</html>
